name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build signed release APK
        run: |
          set +e
          gradle --no-daemon assembleRelease > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # Show the useful lines as annotations so the failure can be read without the full log.
            grep -nE "error|FAILED|What went wrong|Could not|AAPT|Execution failed|not found|cannot find" build.log | head -30 \
              | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}' > key.txt
            echo "::error title=Gradle errors::$(head -c 3500 key.txt)"
            tail -n 25 build.log | sed 's/%/%25/g' | awk '{printf "%s%%0A",$0}' > tail.txt
            echo "::error title=Gradle tail::$(head -c 3500 tail.txt)"
          fi
          exit $code

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk MK6-Console.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MK6-Console-apk
          path: MK6-Console.apk

      - name: Publish as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MK6 Console build ${{ github.run_number }}
          body: Signed APK. Download MK6-Console.apk below and install it on your phone.
          files: MK6-Console.apk
