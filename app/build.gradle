plugins {
    id 'com.android.application'
}

android {
    namespace 'com.azimsupandi.mk6console'
    compileSdk 34

    defaultConfig {
        applicationId 'com.azimsupandi.mk6console'
        minSdk 26
        targetSdk 34
        // Each CI run gets a higher versionCode so a new APK installs over the old one.
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '1.0'
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'mk6console'
            keyAlias 'mk6'
            keyPassword 'mk6console'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
